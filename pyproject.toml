[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aiotrimlight"
version = "0.2.0"
description = "Asynchronous client for the Trimlight V3 local HTTP API"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.13.0",
  "yarl>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/spdevpro/trimlight-ha-api"
Source = "https://github.com/spdevpro/trimlight-ha-api"
Issues = "https://github.com/spdevpro/trimlight-ha-api/issues"

[dependency-groups]
test = [
  "mypy>=1.19.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
  "twine>=6.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiotrimlight"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aiotrimlight"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
