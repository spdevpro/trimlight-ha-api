name: Release

on:
  release:
    types:
      - released

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Validate release tag
        shell: bash
        run: |
          package_version="$(uv version --short)"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi
      - name: Install build dependencies
        run: uv sync --locked --group test
      - name: Build distributions
        run: uv build --no-sources --clear
      - name: Check distribution metadata
        run: uv run --no-sync twine check dist/*
      - name: Test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/aiotrimlight
    permissions:
      id-token: write # Used only for PyPI Trusted Publishing.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
